<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" width="680" height="280">
<title>VITAL Fitness Coach logo</title>
<desc>VITAL wordmark and Fitness Coach subtitle contained within oval, V-heartbeat icon at left edge</desc>
<defs>
  <radialGradient id="og" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="50%"  stop-color="#EAF0F8"/>
    <stop offset="82%"  stop-color="#C8D4DC"/>
    <stop offset="100%" stop-color="#9EB0B8" stop-opacity="0.4"/>
  </radialGradient>
  <linearGradient id="vg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#8FA0C0"/>
    <stop offset="30%"  stop-color="#4B6FD8"/>
    <stop offset="55%"  stop-color="#2540F8"/>
    <stop offset="78%"  stop-color="#6E5EF4"/>
    <stop offset="100%" stop-color="#C8B0E2"/>
  </linearGradient>
  <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#0ABAFC"/>
    <stop offset="30%"  stop-color="#1080FA"/>
    <stop offset="62%"  stop-color="#7B1EFC"/>
    <stop offset="85%"  stop-color="#AA28EC"/>
    <stop offset="100%" stop-color="#C068E0"/>
  </linearGradient>
  <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#DCC8DC"/>
    <stop offset="15%"  stop-color="#BAD4F4"/>
    <stop offset="38%"  stop-color="#2581E5"/>
    <stop offset="100%" stop-color="#1F68D8"/>
  </linearGradient>
  <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#78B8F6"/>
    <stop offset="100%" stop-color="#2B7EE0"/>
  </linearGradient>
  <clipPath id="oc">
    <ellipse cx="340" cy="140" rx="318" ry="128"/>
  </clipPath>
</defs>

<rect width="680" height="280" fill="#034436"/>
<ellipse cx="340" cy="140" rx="318" ry="128" fill="url(#og)"/>

<g clip-path="url(#oc)">
  <polygon points="30,60  54,60  108,200  84,200" fill="url(#vg)"/>
  <polygon points="84,200  108,200  146,108  122,108" fill="url(#vg)" opacity="0.88"/>
  <polygon points="42,60  54,60  108,200  96,200" fill="#0A20C8" opacity="0.16"/>
  <polyline
    points="34,142  72,142  84,142  96,86  110,196  122,114  136,142  182,142"
    fill="none"
    stroke="url(#hg)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="96" cy="86" r="5"  fill="#F8A030" opacity="0.95"/>
  <circle cx="96" cy="86" r="10" fill="#F8A030" opacity="0.22"/>
  <text
    x="196" y="168"
    font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
    font-size="104"
    font-weight="900"
    letter-spacing="-3"
    fill="url(#tg)"
  >VITAL</text>
  <text
    x="200" y="215"
    font-family="'Arial','Helvetica Neue',sans-serif"
    font-size="30"
    font-weight="400"
    letter-spacing="3"
    fill="url(#sg)"
  >FITNESS COACH</text>
</g>

</svg>
